[package]
name = "weikav-studio"
version = "0.9.2"
edition = "2024"
rust-version = "1.88"
description = "Native WEIKAV NUT75 configurator for macOS and Windows"
license = "MIT"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
hidapi = { version = "2.6.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
rfd = "0.15"
anyhow = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "block2"] }
hidapi = { version = "2.6.7", default-features = false, features = ["macos-shared-device"] }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }

[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "weikav-studio"
path = "src/main.rs"
