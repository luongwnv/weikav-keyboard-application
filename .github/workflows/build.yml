name: Native desktop builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          scripts/package-macos.sh
          ditto -c -k --sequesterRsrc --keepParent "dist/NUT Studio.app" "dist/NUT-Studio-macOS.zip"
      - name: Package Windows portable app
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NUT-Studio-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.zip
          if-no-files-found: error
